version: '3.8'

services:
  # ---------------------------------------------
  # PostgreSQL Database
  # ---------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: laptop_store_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: laptop_store
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ---------------------------------------------
  # Redis Cache & Message Broker
  # ---------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: laptop_store_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ---------------------------------------------
  # Keycloak IAM Service
  # ---------------------------------------------
  keycloak:
    image: quay.io/keycloak/keycloak:24.0
    container_name: laptop_store_keycloak
    command: start-dev --import-realm
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: adminpassword
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/laptop_store
      KC_DB_USERNAME: postgres
      KC_DB_PASSWORD: postgrespassword
      KC_HTTP_PORT: 8080
      KC_HOSTNAME_STRICT: "false"
    ports:
      - "8080:8080"
    volumes:
      - ./infrastructure/keycloak:/opt/keycloak/data/import
    depends_on:
      postgres:
        condition: service_healthy

  # ---------------------------------------------
  # Backend API (FastAPI)
  # ---------------------------------------------
  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    container_name: laptop_store_api
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:postgrespassword@postgres:5432/laptop_store
      - SYNC_DATABASE_URL=postgresql://postgres:postgrespassword@postgres:5432/laptop_store
      - REDIS_URL=redis://redis:6379/0
      - KEYCLOAK_URL=http://keycloak:8080
      - KEYCLOAK_REALM=laptop-store
      - KEYCLOAK_CLIENT_ID=store-backend
      - KEYCLOAK_CLIENT_SECRET=sample_client_secret_here
      - ENVIRONMENT=development
      - DEBUG=True
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # ---------------------------------------------
  # Frontend (Next.js)
  # ---------------------------------------------
  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    container_name: laptop_store_web
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000/api/v1
      - NEXT_PUBLIC_KEYCLOAK_URL=http://localhost:8080
      - NEXT_PUBLIC_KEYCLOAK_REALM=laptop-store
      - NEXT_PUBLIC_KEYCLOAK_CLIENT_ID=store-frontend
    depends_on:
      - api

volumes:
  postgres_data:
  redis_data:
